<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3학년 대입 지원현황</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0B3E86; --navy2:#092f66; --gold:#F5B301; --gold-d:#c8920a;
  --green:#1A9A3E; --red:#c0392b; --ink:#141a24; --soft:#3d4652;
  --line:#b9c4d4; --lt:#eef3fa;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans KR',sans-serif;background:#f3efe6;color:var(--ink);word-break:keep-all;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:15px}

/* ── 로그인 ── */
#gate{position:fixed;inset:0;background:var(--navy2);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.gatebox{background:#fff;border:3px solid var(--navy2);box-shadow:8px 8px 0 var(--gold);padding:34px 30px;width:100%;max-width:360px;text-align:center}
.gatebox h1{font-size:21px;font-weight:900;color:var(--navy);letter-spacing:-.02em}
.gatebox .sub{font-size:13px;color:var(--soft);margin:6px 0 20px}
.gatebox input{width:100%;padding:12px 14px;border:2.5px solid #cfc7b2;text-align:center;font-size:16px}
.gatebox input:focus{outline:none;border-color:var(--navy)}
.gatebox button{width:100%;margin-top:12px;padding:12px;background:var(--navy);color:#fff;border:2.5px solid var(--navy2);box-shadow:3px 3px 0 rgba(9,47,102,.45);font-size:16px;font-weight:900}
.gatebox button:active{transform:translate(1px,1px);box-shadow:1px 1px 0 rgba(9,47,102,.45)}
#gateerr{color:var(--red);font-size:13px;margin-top:10px;font-weight:700;min-height:18px}

/* ── 헤더 ── */
header{background:var(--navy);color:#fff;padding:18px 16px 14px;position:relative;border-bottom:6px solid var(--gold)}
.hwrap{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
header .en{color:var(--gold);font-size:11px;font-weight:800;letter-spacing:.2em}
header h1{font-size:20px;font-weight:900;letter-spacing:-.02em}
header .live{font-size:12px;color:#cfe0f7;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.35}}

/* ── 탭 ── */
nav{background:#fff;border-bottom:2.5px solid var(--navy2);position:sticky;top:0;z-index:20}
.tabs{max-width:1100px;margin:0 auto;display:flex;overflow-x:auto}
.tab{flex:1;min-width:76px;padding:12px 6px;border:none;background:none;font-size:15px;font-weight:800;color:var(--soft);border-bottom:4px solid transparent;white-space:nowrap}
.tab.on{color:var(--navy);border-bottom-color:var(--gold)}
.tab .cnt{font-size:11px;color:#8a94a3;font-weight:500;display:block}
.tab.on .cnt{color:var(--gold-d)}

main{max-width:1100px;margin:0 auto;padding:18px 12px 60px}

/* ── 통계 타일 ── */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:10px;margin-bottom:16px}
.stat{background:#fff;border:2.5px solid var(--navy2);padding:12px 8px;text-align:center;box-shadow:3px 3px 0 rgba(9,47,102,.9)}
.stat .lb{font-size:12px;font-weight:800;color:var(--soft)}
.stat .v{font-size:24px;font-weight:900;color:var(--navy);line-height:1.2}
.stat.g .v{color:var(--green)} .stat.gd .v{color:var(--gold-d)} .stat.r .v{color:var(--red)}

/* ── 필터 ── */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters select,.filters input{padding:9px 12px;border:2.5px solid #cfc7b2;background:#fff;font-size:14px;border-radius:0}
.filters input{flex:1;min-width:140px}
.filters select:focus,.filters input:focus{outline:none;border-color:var(--navy)}

/* ── 전체 테이블 ── */
.tblwrap{background:#fff;border:2.5px solid var(--navy2);overflow-x:auto;box-shadow:4px 4px 0 rgba(9,47,102,.9)}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:760px}
th{background:var(--navy2);color:#fff;padding:10px 8px;font-size:13px;font-weight:700;white-space:nowrap;text-align:left}
td{padding:9px 8px;border-top:1px solid #e8e4d8;vertical-align:middle}
tr.rowbtn{cursor:pointer}
tr.rowbtn:hover td{background:#f8f5ec}
.empty{padding:36px;text-align:center;color:var(--soft);font-size:14px}

/* ── 배지 ── */
.badge{display:inline-block;padding:2px 9px;font-size:12.5px;font-weight:800;white-space:nowrap;border:2px solid transparent}
.b-wait{background:#eee9dd;color:var(--soft);border-color:#d5cfc0}
.b-pass1{background:#fff;color:var(--navy);border-color:var(--navy)}
.b-first{background:#e3f4e8;color:#127a30;border-color:#127a30}
.b-add{background:#fdf3d5;color:var(--gold-d);border-color:var(--gold-d)}
.b-rsv{background:#fff;color:var(--gold-d);border:2px dashed var(--gold-d)}
.b-fail{background:#fbe9e7;color:var(--red);border-color:#d98a8a}
.b-final{background:var(--green);color:#fff;border-color:#127a30;margin-left:4px}
.tcat{display:inline-block;padding:1px 8px;background:#fff;color:var(--navy);font-size:12px;font-weight:800;border:2px solid var(--navy);white-space:nowrap}

/* ── 반별 학생 카드 ── */
.scard{background:#fff;border:2.5px solid var(--navy2);margin-bottom:12px;overflow:hidden;box-shadow:3px 3px 0 rgba(9,47,102,.9)}
.shead{display:flex;align-items:center;gap:10px;padding:11px 14px;background:#faf7f0;border-bottom:2px solid #e8e4d8}
.snum{background:var(--navy);color:#fff;font-weight:900;font-size:13px;min-width:38px;text-align:center;padding:6px 0;border:2px solid var(--navy2)}
.sname{font-weight:900;font-size:16px;color:var(--ink)}
.ssum{font-size:12.5px;color:var(--soft);margin-left:auto;text-align:right}
.addbtn{background:#fff;border:2px solid var(--navy);color:var(--navy);padding:5px 12px;font-size:13px;font-weight:800;white-space:nowrap}
.addbtn:hover{background:var(--navy);color:#fff}
.entries{padding:4px 0}
.entry{display:flex;align-items:center;gap:10px;padding:9px 14px;cursor:pointer;border-top:1px solid #f0ece0;flex-wrap:wrap}
.entry:first-child{border-top:none}
.entry:hover{background:#f8f5ec}
.e-univ{font-weight:800;font-size:14.5px;color:var(--ink)}
.e-major{font-size:13.5px;color:var(--soft)}
.e-type{font-size:12.5px;color:var(--soft)}
.e-right{margin-left:auto;display:flex;align-items:center;gap:4px}
.noentry{padding:12px 14px;font-size:13px;color:#9a917c}

/* ── 모달 ── */
#modal{position:fixed;inset:0;background:rgba(9,20,40,.55);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:20px;overflow-y:auto}
#modal.show{display:flex}
.mbox{background:#fff;border:3px solid var(--navy2);box-shadow:6px 6px 0 var(--gold);width:100%;max-width:480px;padding:24px 22px;margin-top:4vh}
.mbox h2{font-size:17px;font-weight:900;color:var(--navy);padding-left:21px;position:relative;margin-bottom:16px}
.mbox h2::before{content:"";position:absolute;left:0;top:4px;width:13px;height:13px;background:var(--gold);border:2px solid var(--navy2)}
.frow{margin-bottom:12px}
.frow label{display:block;font-size:13px;font-weight:800;color:var(--soft);margin-bottom:5px}
.frow input,.frow select{width:100%;padding:10px 12px;border:2.5px solid #cfc7b2;border-radius:0}
.frow input:focus,.frow select:focus{outline:none;border-color:var(--navy)}
.frow2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--green);margin:14px 0 4px}
.chk input{width:18px;height:18px;accent-color:var(--green)}
.mbtns{display:flex;gap:8px;margin-top:18px}
.mbtns button{flex:1;padding:12px;font-size:15px;font-weight:900;border:none}
.btn-save{background:var(--navy);color:#fff;border:2.5px solid var(--navy2)!important;box-shadow:3px 3px 0 rgba(9,47,102,.45)}
.btn-save:active{transform:translate(1px,1px);box-shadow:1px 1px 0 rgba(9,47,102,.45)}
.btn-cancel{background:#fff;color:var(--soft);border:2px solid #b3aa90!important}
.btn-del{background:#fff;color:var(--red);border:2px solid var(--red)!important;flex:0 0 auto;padding:12px 16px!important}

/* ── 엑셀 불러오기 모달 ── */
#imodal{position:fixed;inset:0;background:rgba(9,20,40,.55);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:20px;overflow-y:auto}
#imodal.show{display:flex}
.ifile{border:2px solid #cfc7b2;padding:10px 12px;margin-bottom:8px}
.ifile .fh{font-weight:900;font-size:14px;color:var(--navy);margin-bottom:4px}
.ifile .fh .warn{color:var(--red);font-weight:700;font-size:12.5px}
.ifile .frow-i{font-size:13px;color:var(--soft);padding:2px 0;border-top:1px dashed #e3ddd0}
.ifile .frow-i b{color:var(--ink)}

/* ── 기타 ── */
.toolrow{display:flex;justify-content:flex-end;gap:8px;margin-bottom:10px}
.csvbtn{background:#fff;border:2px solid #b3aa90;padding:6px 14px;font-size:13px;font-weight:800;color:var(--soft)}
.csvbtn:hover{border-color:var(--navy);color:var(--navy)}
footer{text-align:center;font-size:12.5px;font-weight:800;color:var(--navy);padding:24px 0 40px}
footer b{color:var(--navy)}
/* ── 모바일: 전체 탭 표 → 카드형 ── */
@media(max-width:640px){
  header h1{font-size:17px}
  .tab{min-width:64px;padding:10px 4px;font-size:14px}
  .stats{grid-template-columns:repeat(3,1fr)}
  .stat .v{font-size:20px}
  .tblwrap{overflow-x:visible;border:none;background:none;box-shadow:none}
  table{min-width:0}
  thead{display:none}
  table,tbody{display:block;width:100%}
  tr.rowbtn,tr{display:block;background:#fff;border:2.5px solid var(--navy2);padding:10px 12px;margin-bottom:10px;box-shadow:3px 3px 0 rgba(9,47,102,.9)}
  td{display:inline-block;border:none;padding:1px 4px 1px 0;vertical-align:middle}
  td:nth-child(1)::after{content:"반"}
  td:nth-child(2)::after{content:"번"}
  td:nth-child(1),td:nth-child(2){font-size:12.5px;color:var(--soft);font-weight:700}
  td:nth-child(4){display:block;padding-top:4px;font-size:15px}
  td:nth-child(8){display:block;padding-top:5px}
  td:nth-child(9){display:block;padding-top:3px}
  td:empty{display:none}
  .empty{display:block;background:#fff;border:2.5px solid var(--navy2)}
  .shead{flex-wrap:wrap}
  .ssum{flex-basis:100%;text-align:left;margin-left:48px;order:5}
  .ssum:empty{display:none}
  .entry{padding:9px 12px}
  .mbox{padding:20px 16px}
}
</style>
</head>
<body>

<div id="gate">

    <div id="gateerr"></div>
  </div>
</div>

<header>
  <div class="hwrap">

    </div>

  </div>
</header>

<nav><div class="tabs" id="tabs"></div></nav>

<main id="main"></main>

<div id="modal">
  <div class="mbox">
    <h2 id="mtitle">지원 추가</h2>
    <div class="frow"><label>대학명 *</label><input id="f-univ" placeholder="예: 전북대"></div>

          <option>정시(다)</option><option>기타</option>
        </select>
      </div>
      <div class="frow"><label>전형명</label><input id="f-tname" placeholder="예: 지역인재전형"></div>
    </div>
    <div class="frow2">
      <div class="frow"><label>1단계 (단계별 전형)</label>
        <select id="f-stage1"><option value="">발표 전 / 해당없음</option><option>합격</option><option>불합격</option></select>
      </div>
      <div class="frow"><label>최종결과</label>
        <select id="f-fin"><option value="">발표 전</option><option>합격</option><option>추가합격</option><option>불합격</option></select>
      </div>
    </div>
    <div class="frow2">
      <div class="frow"><label>최초후보순위(예비)</label><input id="f-rsv" placeholder="예: 30"></div>
      <div class="frow"><label>등록여부</label>
        <select id="f-reg"><option value="">미정</option><option value="Y">Y (등록)</option><option value="N">N (미등록)</option></select>
      </div>
    </div>
    <div class="frow2">
      <div class="frow"><label>불합격사유</label>
        <select id="f-fail"><option value="">해당없음</option><option>미응시</option><option>최저미달</option><option>불합격</option></select>
      </div>
      <div class="frow"><label>면접일자</label><input id="f-iv" placeholder="예: 11.21"></div>
    </div>
    <div class="frow"><label>비고 (순위변동·추합내용)</label><input id="f-memo" placeholder="예: 30-20-5 추합"></div>
    <div class="mbtns">
      <button class="btn-del" id="mdel" style="display:none">삭제</button>
      <button class="btn-cancel" id="mcancel">취소</button>
      <button class="btn-save" id="msave">저장</button>
    </div>
  </div>
</div>

<div id="imodal">
  <div class="mbox" style="max-width:560px">
    <h2>엑셀 불러오기 — 확인</h2>
    <div id="ibody" style="max-height:50vh;overflow-y:auto;margin-bottom:6px"></div>
    <div class="frow" style="display:flex;gap:16px;font-size:14px;font-weight:700">
      <label style="display:flex;align-items:center;gap:6px"><input type="radio" name="imode" value="add" checked> 기존 내역에 추가(중복 제외)</label>
      <label style="display:flex;align-items:center;gap:6px;color:var(--red)"><input type="radio" name="imode" value="replace"> 기존 내역 교체</label>
    </div>
    <div class="mbtns">
      <button class="btn-cancel" id="icancel">취소</button>
      <button class="btn-save" id="isave">저장</button>
    </div>
  </div>
</div>

<footer>호남고등학교 3학년부 · 2026학년도(2027학년도 대입) &nbsp;|&nbsp; 제작 · <b>호남고 조영신</b></footer>

let TAB = "all";        // "all" | "univ" | "1".."6"
let fRes = "", fCat = "", fQ = "", uSort = "cnt";
let editCtx = null;     // {c, n, idx|null}

/* ── 로그인 ── */
function tryLogin(){
  if ($("pw").value === PASS) {
    sessionStorage.setItem("jh_auth","1");
    $("gate").style.display = "none";
  } else { $("gateerr").textContent = "비밀번호가 올바르지 않습니다."; $("pw").value = ""; }
}
$("pwbtn").onclick = tryLogin;
$("pw").addEventListener("keydown", e => { if (e.key === "Enter") tryLogin(); });
if (sessionStorage.getItem("jh_auth") === "1") $("gate").style.display = "none";

/* ── 실시간 구독 ── */
onSnapshot(collection(db, COL), snap => {
  DATA = {};
  snap.forEach(d => DATA[d.id] = d.data());
  render();
});

/* ── 유틸 ── */
const esc = s => String(s ?? "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
// 구버전 데이터(result 문자열) → 신버전(1단계/최종결과 분리) 자동 변환
function norm(a){
  if (a.fin !== undefined) return a;
  const r = a.result || "";
  return {...a,
    stage1: r === "1단계 합격" ? "합격" : "",
    fin: r === "최초합격" ? "합격" : (r === "추가합격" || r === "불합격") ? r : "",
    rsv: r === "충원대기" ? (a.wait || "") : "",
    failReason: "", reg: a.final ? "Y" : "", iv: ""};
}
const getApps = (c, n) => ((DATA[`${c}-${n}`]?.apps) || []).map(norm);

function allEntries(cls){
  const out = [];
  for (const c of Object.keys(ROSTER)) {
    if (cls !== "all" && c !== cls) continue;
    for (const [n, nm] of ROSTER[c].s)
      getApps(c, n).forEach((a, idx) => out.push({c, n, nm, idx, ...a}));
  }
  return out;
}
function counts(list){
  const k = {tot:list.length, first:0, add:0, fail:0, wait:0};
  for (const a of list) {
    if (a.fin === "합격") k.first++;
    else if (a.fin === "추가합격") k.add++;
    else if (a.fin === "불합격") k.fail++;
    else k.wait++;
  }
  return k;
}
// 필터용 상태 판정
function stateOf(a){
  if (a.fin === "합격") return "합격";
  if (a.fin === "추가합격") return "추가합격";
  if (a.fin === "불합격") return "불합격";
  if (a.rsv) return "충원대기(예비)";
  if (a.stage1 === "합격") return "1단계 합격";
  return "발표 전";
}
// 대학별 묶기: 공백 제거 + "○○대학교"="○○대" 통일, 표시명은 가장 많이 쓰인 표기
const uKey = u => String(u || "").replace(/\s/g, "").replace(/대학교$/, "대");
function groupByUniv(list){
  const g = {};
  for (const a of list) {
    const k = uKey(a.univ);
    if (!g[k]) g[k] = {names:{}, items:[]};
    g[k].names[a.univ] = (g[k].names[a.univ] || 0) + 1;
    g[k].items.push(a);
  }
  return Object.values(g).map(v => ({
    name: Object.entries(v.names).sort((a, b) => b[1] - a[1] || b[0].length - a[0].length)[0][0],
    items: v.items
  }));
}

/* ── 탭 ── */
function renderTabs(){
  const mk = (id, label) => {
    const k = counts(allEntries(id));
    return `<button class="tab ${TAB===id?"on":""}" data-tab="${id}">${label}<span class="cnt">${k.tot}건 · 합 ${k.first+k.add}</span></button>`;
  };
  const uniN = groupByUniv(allEntries("all")).length;
  $("tabs").innerHTML = mk("all","전체")
    + `<button class="tab ${TAB==="univ"?"on":""}" data-tab="univ">대학별<span class="cnt">${uniN}개교</span></button>`
    + Object.keys(ROSTER).map(c => mk(c, c+"반")).join("");
  document.querySelectorAll(".tab").forEach(b => b.onclick = () => { TAB = b.dataset.tab; render(); });
}

/* ── 본문 ── */
function statHtml(k){
  return `<div class="stats">
    <div class="stat"><div class="lb">지원 건수</div><div class="v">${k.tot}</div></div>
    <div class="stat g"><div class="lb">최초합격</div><div class="v">${k.first}</div></div>
    <div class="stat gd"><div class="lb">추가합격</div><div class="v">${k.add}</div></div>
    <div class="stat r"><div class="lb">불합격</div><div class="v">${k.fail}</div></div>
    <div class="stat"><div class="lb">발표 전·대기</div><div class="v">${k.wait}</div></div>
  </div>`;
}
function badge(a){
  const st = stateOf(a);
  const cls = {"합격":"b-first","추가합격":"b-add","불합격":"b-fail","충원대기(예비)":"b-rsv","1단계 합격":"b-pass1","발표 전":"b-wait"}[st];
  let label = st === "충원대기(예비)" ? "예비 " + esc(a.rsv) : st;
  let h = `<span class="badge ${cls}">${label}</span>`;
  if (a.rsv && st !== "충원대기(예비)") h += ` <span class="badge b-rsv">예비 ${esc(a.rsv)}</span>`;
  if (st === "불합격" && a.failReason) h += ` <span class="badge b-fail" style="background:#fff;border:1.5px solid #f3c5be">${esc(a.failReason)}</span>`;
  if (a.reg === "Y") h += `<span class="badge b-final">등록 Y</span>`;
  else if (a.reg === "N") h += `<span class="badge b-wait" style="margin-left:4px">등록 N</span>`;
  return h;
}

function render(keepFocus){
  renderTabs();
  const m = $("main");
  if (TAB === "all") {
    let list = allEntries("all");
    const k = counts(list);
    if (fRes) list = list.filter(a => stateOf(a) === fRes);
    if (fCat) list = list.filter(a => a.cat === fCat);
    if (fQ) { const q = fQ.toLowerCase();
      list = list.filter(a => (a.univ+a.major+a.nm+(a.tname||"")).toLowerCase().includes(q)); }
    m.innerHTML = statHtml(k) + `
      <div class="filters">
        <select id="ff-res"><option value="">결과 전체</option>${FILTERS.map(r=>`<option ${fRes===r?"selected":""}>${r}</option>`).join("")}</select>
        <select id="ff-cat"><option value="">전형 전체</option>${["학생부교과","학생부종합","논술","실기/특기","정시(가)","정시(나)","정시(다)","기타"].map(c=>`<option ${fCat===c?"selected":""}>${c}</option>`).join("")}</select>
        <input id="ff-q" placeholder="이름·대학·학과 검색" value="${esc(fQ)}">
      </div>
      <div class="toolrow">
        <button class="csvbtn" id="xlsin">📥 엑셀 불러오기 (관심대학 리스트)</button>
        <button class="csvbtn" id="csv">⬇ 엑셀(CSV) 다운로드</button>
      </div>
      <div class="tblwrap"><table>
        <thead><tr><th>반</th><th>번호</th><th>이름</th><th>대학</th><th>모집단위</th><th>전형</th><th>전형명</th><th>결과</th><th>비고</th></tr></thead>
        <tbody>${list.length ? list.map(a => `
          <tr class="rowbtn" data-c="${a.c}" data-n="${a.n}" data-i="${a.idx}">
            <td>${a.c}</td><td>${a.n}</td><td style="font-weight:700">${esc(a.nm)}</td>
            <td style="font-weight:700">${esc(a.univ)}</td><td>${esc(a.major)}</td>
            <td><span class="tcat">${esc(a.cat)}</span></td><td>${esc(a.tname||"")}</td>
            <td>${badge(a)}</td><td style="font-size:13px;color:var(--soft)">${esc([a.iv?"면접 "+a.iv:"",a.memo||""].filter(Boolean).join(" · "))}</td>
          </tr>`).join("") : `<tr><td colspan="9" class="empty">표시할 지원 내역이 없습니다. 반 탭에서 학생별로 추가하세요.</td></tr>`}
        </tbody></table></div>`;
    $("ff-res").onchange = e => { fRes = e.target.value; render(); };
    $("ff-cat").onchange = e => { fCat = e.target.value; render(); };
    const q = $("ff-q");
    q.oninput = e => { fQ = e.target.value; render(true); };
    if (keepFocus) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
    $("csv").onclick = downloadCsv;
    $("xlsin").onclick = () => $("xlsfile").click();
    m.querySelectorAll("tr.rowbtn").forEach(tr => tr.onclick = () => openModal(tr.dataset.c, +tr.dataset.n, +tr.dataset.i));
  } else if (TAB === "univ") {
    const k = counts(allEntries("all"));
    const q = fQ.toLowerCase();
    let groups = groupByUniv(allEntries("all"))
      .map(g => ({...g, view: g.items.filter(a =>
        (!fRes || stateOf(a) === fRes) &&
        (!fCat || a.cat === fCat) &&
        (!q || (a.univ + a.major + a.nm + (a.tname || "")).toLowerCase().includes(q)))}))
      .filter(g => g.view.length)
      .map(g => ({...g, k: counts(g.view)}));
    groups.sort(
      uSort === "name" ? (a, b) => a.name.localeCompare(b.name, "ko") :
      uSort === "pass" ? (a, b) => (b.k.first + b.k.add) - (a.k.first + a.k.add) || b.view.length - a.view.length :
      (a, b) => b.view.length - a.view.length || a.name.localeCompare(b.name, "ko"));
    m.innerHTML = statHtml(k) + `
      <div class="filters">
        <select id="ff-sort">
          <option value="cnt" ${uSort==="cnt"?"selected":""}>지원 많은 순</option>
          <option value="pass" ${uSort==="pass"?"selected":""}>합격 많은 순</option>
          <option value="name" ${uSort==="name"?"selected":""}>대학명 가나다순</option>
        </select>
        <select id="ff-res"><option value="">결과 전체</option>${FILTERS.map(r=>`<option ${fRes===r?"selected":""}>${r}</option>`).join("")}</select>
        <select id="ff-cat"><option value="">전형 전체</option>${["학생부교과","학생부종합","논술","실기/특기","정시(가)","정시(나)","정시(다)","기타"].map(c=>`<option ${fCat===c?"selected":""}>${c}</option>`).join("")}</select>
        <input id="ff-q" placeholder="이름·대학·학과 검색" value="${esc(fQ)}">
      </div>` +
      (groups.length ? groups.map(g => `<div class="scard">
        <div class="shead">
          <div class="snum" style="min-width:auto;padding:6px 10px">${g.view.length}건</div>
          <div class="sname">${esc(g.name)}</div>
          <div class="ssum"><b style="color:var(--green)">합 ${g.k.first}</b> · <span style="color:var(--gold-d)">추합 ${g.k.add}</span> · <span style="color:var(--red)">불 ${g.k.fail}</span> · 대기 ${g.k.wait}</div>
        </div>
        <div class="entries">${g.view.map(a => `
          <div class="entry" data-c="${a.c}" data-n="${a.n}" data-i="${a.idx}">
            <span class="e-univ">${a.c}반 ${String(a.n).padStart(2,"0")} ${esc(a.nm)}</span>
            <span class="e-major">${esc(a.major)}</span>
            <span class="tcat">${esc(a.cat)}</span>
            ${a.tname ? `<span class="e-type">${esc(a.tname)}</span>` : ""}
            <span class="e-right">${badge(a)}</span>
          </div>`).join("")}
        </div></div>`).join("")
      : `<div class="empty" style="background:#fff;border:2.5px solid var(--navy2)">표시할 지원 내역이 없습니다.</div>`);
    $("ff-sort").onchange = e => { uSort = e.target.value; render(); };
    $("ff-res").onchange = e => { fRes = e.target.value; render(); };
    $("ff-cat").onchange = e => { fCat = e.target.value; render(); };
    const uq = $("ff-q");
    uq.oninput = e => { fQ = e.target.value; render(true); };
    if (keepFocus) { uq.focus(); uq.setSelectionRange(uq.value.length, uq.value.length); }
    m.querySelectorAll(".entry").forEach(el => el.onclick = () => openModal(el.dataset.c, +el.dataset.n, +el.dataset.i));
  } else {
    const c = TAB, k = counts(allEntries(c));
    m.innerHTML = statHtml(k) +
      `<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap">
        <div style="font-size:13px;color:var(--soft);flex:1">담임 ${ROSTER[c].t} 선생님 · 학생 ${ROSTER[c].s.length}명 — 지원 내역을 누르면 결과를 수정할 수 있습니다.</div>
        <button class="csvbtn" id="xlsin">📥 엑셀 불러오기</button>
      </div>` +
      ROSTER[c].s.map(([n, nm]) => {
        const apps = getApps(c, n);
        const kk = counts(apps);
        return `<div class="scard">
          <div class="shead">
            <div class="snum">${String(n).padStart(2,"0")}</div>
            <div class="sname">${esc(nm)}</div>
            <div class="ssum">${apps.length ? `${apps.length}건 · <b style="color:var(--green)">합 ${kk.first+kk.add}</b> · <span style="color:var(--red)">불 ${kk.fail}</span>` : ""}</div>
            <button class="addbtn" data-c="${c}" data-n="${n}">＋ 지원 추가</button>
          </div>
          <div class="entries">${apps.length ? apps.map((a, i) => `
            <div class="entry" data-c="${c}" data-n="${n}" data-i="${i}">
              <span class="e-univ">${esc(a.univ)}</span>
              <span class="e-major">${esc(a.major)}</span>
              <span class="tcat">${esc(a.cat)}</span>
              ${a.tname ? `<span class="e-type">${esc(a.tname)}</span>` : ""}
              <span class="e-right">${badge(a)}</span>
            </div>`).join("") : `<div class="noentry">아직 입력된 지원 내역이 없습니다.</div>`}
          </div></div>`;
      }).join("");
    $("xlsin").onclick = () => $("xlsfile").click();
    m.querySelectorAll(".addbtn").forEach(b => b.onclick = () => openModal(b.dataset.c, +b.dataset.n, null));
    m.querySelectorAll(".entry").forEach(el => el.onclick = () => openModal(el.dataset.c, +el.dataset.n, +el.dataset.i));
  }
}

/* ── 모달 ── */
function openModal(c, n, idx){
  editCtx = {c, n, idx};
  const nm = ROSTER[c].s.find(s => s[0] === n)[1];
  $("mtitle").textContent = `${c}반 ${String(n).padStart(2,"0")}번 ${nm} — ${idx === null ? "지원 추가" : "수정"}`;
  const a = idx === null ? {} : getApps(c, n)[idx] || {};
  $("f-univ").value = a.univ || ""; $("f-major").value = a.major || "";
  $("f-cat").value = a.cat || "학생부교과"; $("f-tname").value = a.tname || "";
  $("f-stage1").value = a.stage1 || ""; $("f-fin").value = a.fin || "";
  $("f-rsv").value = a.rsv || ""; $("f-reg").value = a.reg || "";
  $("f-fail").value = a.failReason || ""; $("f-iv").value = a.iv || "";
  $("f-memo").value = a.memo || "";
  $("mdel").style.display = idx === null ? "none" : "block";
  $("modal").classList.add("show");
  if (idx === null) $("f-univ").focus();
}
function closeModal(){ $("modal").classList.remove("show"); editCtx = null; }
$("mcancel").onclick = closeModal;
$("modal").addEventListener("click", e => { if (e.target === $("modal")) closeModal(); });

async function saveDoc(c, n, apps){
  const nm = ROSTER[c].s.find(s => s[0] === n)[1];
  await setDoc(doc(db, COL, `${c}-${n}`), { c, n, name:nm, apps, upd:new Date().toISOString() });
}
$("msave").onclick = async () => {
  if (!editCtx) return;
  const {c, n, idx} = editCtx;
  const a = {
    univ: $("f-univ").value.trim(), major: $("f-major").value.trim(),
    cat: $("f-cat").value, tname: $("f-tname").value.trim(),
    stage1: $("f-stage1").value, fin: $("f-fin").value,
    rsv: $("f-rsv").value.trim(), reg: $("f-reg").value,
    failReason: $("f-fail").value, iv: $("f-iv").value.trim(),
    memo: $("f-memo").value.trim()
  };
  if (!a.univ || !a.major) { alert("대학명과 모집단위를 입력해 주세요."); return; }
  const apps = [...getApps(c, n)];
  if (idx === null) apps.push(a); else apps[idx] = a;
  $("msave").disabled = true;
  try { await saveDoc(c, n, apps); closeModal(); }
  catch (e) { alert("저장 실패: " + e.message); }
  $("msave").disabled = false;
};
$("mdel").onclick = async () => {
  if (!editCtx || editCtx.idx === null) return;
  if (!confirm("이 지원 내역을 삭제할까요?")) return;
  const {c, n, idx} = editCtx;
  const apps = getApps(c, n).filter((_, i) => i !== idx);
  try { await saveDoc(c, n, apps); closeModal(); }
  catch (e) { alert("삭제 실패: " + e.message); }
};

/* ── 엑셀(관심대학 리스트) 불러오기 ── */
const fileInput = document.createElement("input");
fileInput.type = "file"; fileInput.id = "xlsfile"; fileInput.accept = ".xlsx,.xls";
fileInput.multiple = true; fileInput.style.display = "none";
document.body.appendChild(fileInput);

let importPlan = [];   // [{c, n, nameInFile, rosterName, warn, apps:[...]}]

function toCat(row){
  const tu = row.tu || "", si = row.si || "", all = tu + " " + (row.tname || "") + " " + si;
  if (/논술/.test(tu)) return "논술";
  if (/실기|실적|특기/.test(tu)) return "실기/특기";
  if (/정시/.test(si)) {
    const m = all.match(/([가나다])군/);
    return m ? `정시(${m[1]})` : "기타";
  }
  if (/교과/.test(tu)) return "학생부교과";
  if (/종합/.test(tu)) return "학생부종합";
  return "기타";
}
function cleanTname(t){
  t = (t || "").trim();
  const m = t.match(/^[^(]*\((.*)\)$/);   // "학생부교과(일반전형)" → "일반전형"
  return m ? m[1] : t;
}
function shortDate(s){
  // "2026-11-21 ~ 2026-11-22" → "11.21~11.22"
  const d = [...String(s || "").matchAll(/\d{4}-(\d{2})-(\d{2})/g)].map(m => `${+m[1]}.${+m[2]}`);
  if (!d.length) return "";
  return d[0] === d[1] || d.length === 1 ? d[0] : d.join("~");
}

function parseSheet(ws, fname){
  const rows = XLSX.utils.sheet_to_json(ws, {header:1, raw:false, defval:""});
  let c = null, n = null, nameInFile = "";
  for (let i = 0; i < Math.min(rows.length, 8); i++) {
    const line = rows[i].join(" ");
    const m = line.match(/3\s*학년\s*(\d+)\s*반\s*(\d+)\s*번\s*([가-힣]+)/);
    if (m) { c = m[1]; n = +m[2]; nameInFile = m[3]; break; }
  }
  let hIdx = -1, col = {};
  for (let i = 0; i < Math.min(rows.length, 12); i++) {
    const cells = rows[i].map(v => String(v).replace(/\s/g, ""));
    if (cells.includes("대학명") && cells.includes("모집단위")) {
      hIdx = i;
      cells.forEach((h, j) => {
        if (h === "대학명") col.univ = j;
        else if (h === "모집단위") col.major = j;
        else if (h === "전형유형") col.tu = j;
        else if (h === "세부유형") col.tname = j;
        else if (h === "시기") col.si = j;
        else if (h.startsWith("수능최저")) col.min = j;
        else if (h.startsWith("면접일자")) col.interview = j;
        else if (h.startsWith("최종발표")) col.announce = j;
      });
      break;
    }
  }
  if (hIdx < 0) return {error:`${fname}: 헤더(대학명·모집단위)를 찾지 못했습니다.`};
  if (!c || !ROSTER[c] || !ROSTER[c].s.find(s => s[0] === n))
    return {error:`${fname}: "3학년 ○반 ○번 이름" 정보를 찾지 못했거나 명단에 없습니다.`};
  const apps = [];
  for (let i = hIdx + 1; i < rows.length; i++) {
    const r = rows[i];
    const univ = String(r[col.univ] || "").trim();
    const major = String(r[col.major] || "").trim();
    if (!univ || !major) continue;
    const row = {tu:String(r[col.tu]||""), si:String(r[col.si]||""), tname:String(r[col.tname]||"")};
    const memoParts = [];
    if (String(r[col.min]||"").trim().toUpperCase() === "Y") memoParts.push("수능최저 有");
    const an = shortDate(r[col.announce]);
    if (an) memoParts.push("발표 " + an);
    apps.push({univ, major, cat:toCat(row), tname:cleanTname(row.tname),
      stage1:"", fin:"", rsv:"", reg:"", failReason:"",
      iv:shortDate(r[col.interview]), memo:memoParts.join(" · ")});
  }
  const rosterName = ROSTER[c].s.find(s => s[0] === n)[1];
  return {c, n, nameInFile, rosterName, warn:nameInFile !== rosterName, apps};
}

fileInput.onchange = async () => {
  const files = [...fileInput.files];
  fileInput.value = "";
  if (!files.length) return;
  importPlan = []; const errors = [];
  for (const f of files) {
    try {
      const wb = XLSX.read(await f.arrayBuffer());
      const res = parseSheet(wb.Sheets[wb.SheetNames[0]], f.name);
      if (res.error) errors.push(res.error);
      else if (!res.apps.length) errors.push(`${f.name}: 지원 내역 행이 없습니다.`);
      else importPlan.push(res);
    } catch (e) { errors.push(`${f.name}: 읽기 실패 (${e.message})`); }
  }
  if (!importPlan.length) { alert("불러올 수 있는 데이터가 없습니다.\n\n" + errors.join("\n")); return; }
  $("ibody").innerHTML =
    (errors.length ? `<div style="color:var(--red);font-size:13px;font-weight:700;margin-bottom:8px">${errors.map(esc).join("<br>")}</div>` : "") +
    importPlan.map(p => `<div class="ifile">
      <div class="fh">${p.c}반 ${String(p.n).padStart(2,"0")}번 ${esc(p.rosterName)} — ${p.apps.length}건
        ${p.warn ? `<span class="warn">⚠ 파일의 이름(${esc(p.nameInFile)})이 명단과 다릅니다</span>` : ""}</div>
      ${p.apps.map(a => { const ex = [a.iv?"면접 "+a.iv:"", a.memo||""].filter(Boolean).join(" · ");
        return `<div class="frow-i"><b>${esc(a.univ)}</b> ${esc(a.major)} · ${esc(a.cat)}${a.tname ? " · " + esc(a.tname) : ""}${ex ? ` <span style="color:#8a94a3">(${esc(ex)})</span>` : ""}</div>`; }).join("")}
    </div>`).join("");
  $("imodal").classList.add("show");
};

$("icancel").onclick = () => $("imodal").classList.remove("show");
$("imodal").addEventListener("click", e => { if (e.target === $("imodal")) $("imodal").classList.remove("show"); });
$("isave").onclick = async () => {
  const replace = document.querySelector('input[name="imode"]:checked').value === "replace";
  $("isave").disabled = true;
  try {
    for (const p of importPlan) {
      let apps = replace ? [] : [...getApps(p.c, p.n)];
      for (const a of p.apps) {
        const dup = apps.some(x => x.univ === a.univ && x.major === a.major && x.tname === a.tname);
        if (!dup) apps.push(a);
      }
      await saveDoc(p.c, p.n, apps);
    }
    $("imodal").classList.remove("show");
  } catch (e) { alert("저장 실패: " + e.message); }
  $("isave").disabled = false;
};

/* ── CSV ── */
function downloadCsv(){
  const rows = [["반","번호","이름","대학","모집단위","전형구분","전형명","1단계","최종결과","불합격사유","최초후보순위","등록여부","비고","면접일자"]];
  allEntries("all").forEach(a => rows.push([a.c, a.n, a.nm, a.univ, a.major, a.cat, a.tname||"", a.stage1||"", a.fin||"", a.failReason||"", a.rsv||"", a.reg||"", a.memo||"", a.iv||""]));
  const csv = "﻿" + rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(",")).join("\r\n");
  const url = URL.createObjectURL(new Blob([csv], {type:"text/csv"}));
  const aEl = document.createElement("a");
  aEl.href = url; aEl.download = "2026학년도_대입지원현황.csv"; aEl.click();
  URL.revokeObjectURL(url);
}
